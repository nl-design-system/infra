apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zerossl-prod
  namespace: cert-manager
spec:
  acme:
    email: ops@delta10.nl
    externalAccountBinding:
      keyAlgorithm: HS256
      keyID: t9v7IUVcS4RcVu2m64Lshw
      keySecretRef:
        key: secret
        name: zerossl-eabsecret
    privateKeySecretRef:
      name: zerossl-prod
    server: https://acme.zerossl.com/v2/DV90
    solvers:
      - dns01:
          acmeDNS:
            host: https://auth.acme-dns.io/
            accountSecretRef:
              name: acme-dns
              key: acmedns.json
