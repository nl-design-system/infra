apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-receiver
  namespace: flux-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external-gateway
      namespace: istio-gateway
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /hook
      backendRefs:
        - name: webhook-receiver
          namespace: flux-system
          port: 80
