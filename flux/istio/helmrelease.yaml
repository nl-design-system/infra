apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 30m
  chart:
    spec:
      chart: base
      version: 1.27.1
      sourceRef:
        kind: HelmRepository
        name: istio
      interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 30m
  chart:
    spec:
      chart: istiod
      version: 1.27.1
      sourceRef:
        kind: HelmRepository
        name: istio
      interval: 12h
  values:
    pilot:
      autoscaleMin: 2
      replicaCount: 2

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
