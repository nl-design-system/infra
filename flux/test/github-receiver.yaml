apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-receiver
  namespace: test
spec:
  type: github
  secretRef:
    name: receiver-token
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: test-app-main
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: test-app-pr
